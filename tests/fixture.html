<!doctype html><html><head><style>:root{--ink:#111827;--brand:#6d28d9}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:var(--ink)}main{max-width:960px;margin:auto;padding:48px 24px}.card{position:relative;overflow:hidden;border:1px solid #c4b5fd;border-radius:14px;padding:32px;background:linear-gradient(135deg,#fff,#f5f3ff);box-shadow:inset 0 1px #fff,0 14px 30px #312e8122}.card:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 20%,#a78bfa55,transparent 55%);pointer-events:none}.cta{position:relative;height:48px;border:1px solid #5b21b6;border-radius:11px;padding:0 18px;background:var(--brand);color:white;font:600 15px/1 Arial;letter-spacing:-.1px}.cta:hover{transform:translateY(-1px);box-shadow:0 8px 16px #6d28d955}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.tile{height:100px;border:1px solid #e2e8f0;border-radius:8px;background:#fff}@media(max-width:700px){main{padding:24px 16px}.grid{grid-template-columns:1fr}.card{padding:24px}}</style></head><body><main><section class="card"><h1>Measured CTA card</h1><p>Gradient, pseudo-element, radius, border, shadow, and responsive grid.</p><button class="cta">Start now</button><div class="grid"><div class="tile"></div><div class="tile"></div><div class="tile"></div></div></section></main></body></html>
