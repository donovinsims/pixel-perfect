<!doctype html>
<html>
<head>
<style>
@font-face{font-family:"Fixture Sans";src:local("Arial");font-weight:400;font-style:normal;font-display:swap}
:root{--ink:#111827;--brand:#6d28d9}
*{box-sizing:border-box}
body{margin:0;font-family:"Fixture Sans",Arial,sans-serif;background:#f8fafc;color:var(--ink)}
header.site{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid #e2e8f0;background:#fff}
header .brand{font:700 18px/1.2 Arial;letter-spacing:-.2px}
nav.links{display:flex;align-items:center;gap:18px;font-size:14px}
main{max-width:960px;margin:auto;padding:48px 24px}
.card{position:relative;overflow:hidden;border:1px solid #c4b5fd;border-radius:14px;padding:32px;background:linear-gradient(135deg,#fff,#f5f3ff);box-shadow:inset 0 1px #fff,0 14px 30px #312e8122}
.card:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 20%,#a78bfa55,transparent 55%);pointer-events:none}
.cta{position:relative;height:48px;border:1px solid #5b21b6;border-radius:11px;padding:0 18px;background:var(--brand);color:white;font:600 15px/1 Arial;letter-spacing:-.1px}
.cta:hover{transform:translateY(-1px);box-shadow:0 8px 16px #6d28d955}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.tile{height:100px;border:1px solid #e2e8f0;border-radius:8px;background:#fff}
.pricing{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:32px;padding:24px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}
.pricing h2{grid-column:1/-1;margin:0 0 4px;font-size:22px}
.pricing p{grid-column:1/-1;margin:0 0 12px;font-size:15px;color:#475569}
footer.site{padding:24px;text-align:center;color:#475569;font-size:13px;border-top:1px solid #e2e8f0;background:#fff}
@media(max-width:700px){main{padding:24px 16px}.grid{grid-template-columns:1fr}.card{padding:24px}.pricing{grid-template-columns:1fr;padding:16px}nav.links{gap:12px}}
</style>
</head>
<body>
<header class="site"><span class="brand">Pixel Fixture</span><nav class="links"><a href="#one">Overview</a><a href="#two">Pricing</a></nav></header>
<main>
<section class="card" id="one">
<h1>Measured CTA card</h1>
<p>Gradient, pseudo-element, radius, border, shadow, and responsive grid.</p>
<button class="cta">Start now</button>
<div class="grid"><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
</section>
<section class="pricing" id="two">
<h2>Transparent pricing</h2>
<p>Two measured columns that collapse to one at the observed breakpoint.</p>
<div class="tile"></div><div class="tile"></div>
</section>
</main>
<footer class="site">Measured footer content</footer>
</body>
</html>
